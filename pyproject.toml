[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-downloader"
version = "0.1.0"
description = "Safe Linux runtime for station audio downloads"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "SQLAlchemy>=2.0",
  "python-dotenv>=1.0",
  "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
legacy = ["selenium>=4.0", "webdriver-manager>=4.0", "psutil>=5.9", "pyinstaller>=6.0"]

[tool.pytest.ini_options]
testpaths = ["linux_tests"]

[tool.setuptools.packages.find]
include = ["audio_downloader*"]
